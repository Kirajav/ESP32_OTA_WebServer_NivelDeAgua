; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_kit_32]
platform = espressif32@6.3.2
board = heltec_wifi_kit_32
framework = arduino
board_build.partitions = partitions_custom.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file
lib_ldf_mode = deep+
monitor_log2file = logs/monitor_serial.log

build_flags = 
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D WEBSERIAL_LOG_LEVEL=2
    -D ASYNCWEBSERVER_REGEX=0
    -D ARDUINO_HELTEC_WIFI_KIT_32_V1
    -D WIFI_KIT_32
    -D ASYNC_TCP_SSL_ENABLED=0
    -D USE_LITTLEFS=0
    -D USE_SPIFFS=1
    -D CONFIG_TIMEZONE="America/Mexico_City"
    -D CONFIG_CHARSET_UTF8
    -D NDEBUG
    -D CORE_DEBUG_LEVEL=0
    -I lib/ConfigManager

lib_deps = 
    heltecautomation/Heltec ESP32 Dev-Boards @ ^2.1.4
    martinsos/HCSR04 @ ^2.0.0
    bblanchon/ArduinoJson @ ^6.21.3
    ayushsharma82/ElegantOTA @ ^3.1.7
    https://github.com/ayushsharma82/WebSerial.git
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/khoih-prog/ESPAsyncDNSServer.git
    khoih-prog/ESP_DoubleResetDetector@^1.3.2

lib_ignore = 
    AsyncTCP_SSL
    ESPAsync_WiFiManager_Lite
